<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Births &amp; Deaths — Finland</title>
  <script src="https://unpkg.com/frappe-charts@latest/dist/frappe-charts.min.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f6f8;
      color: #1a1a2e;
      min-height: 100vh;
    }
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.02em; }
    header a#navigation {
      color: #63d0ff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid #63d0ff;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      transition: background 0.2s;
    }
    header a#navigation:hover { background: #63d0ff; color: #1a1a2e; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    #chart { background: #fff; border-radius: 10px; padding: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    #status { margin-top: 0.75rem; font-size: 0.85rem; color: #888; min-height: 1.2em; }
    .legend {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #555;
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Births &amp; Deaths</h1>
    <a id="navigation" href="/index.html">← Population</a>
  </header>
  <main>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#63d0ff"></div> Births</div>
      <div class="legend-item"><div class="legend-dot" style="background:#363636"></div> Deaths</div>
    </div>
    <div id="chart"></div>
    <div id="status"></div>
  </main>

  <script>
    const API_URL = 'https://statfin.stat.fi/PxWeb/api/v1/en/StatFin/synt/12dy.px';
    const YEARS = ["2000","2001","2002","2003","2004","2005","2006","2007","2008","2009","2010","2011","2012","2013","2014","2015","2016","2017","2018","2019","2020","2021"];

    function buildQuery(areaCode, contentCode) {
      return {
        query: [
          {
            code: "timeperiod_y",
            selection: { filter: "item", values: YEARS }
          },
          {
            code: "alue_23_20260101",
            selection: { filter: "item", values: [areaCode] }
          },
          {
            code: "contentscode",
            selection: { filter: "item", values: [contentCode] }
          }
        ],
        response: { format: "json-stat2" }
      };
    }

    async function fetchData(areaCode, contentCode) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildQuery(areaCode, contentCode))
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return Object.values(data.value);
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function init() {
      const areaCode = sessionStorage.getItem('currentArea') || 'SSS';
      const areaName = sessionStorage.getItem('currentAreaName') || 'Finland';

      setStatus(`Loading births & deaths for ${areaName}…`);

      try {
        const [births, deaths] = await Promise.all([
          fetchData(areaCode, 'synt-vm01'),
          fetchData(areaCode, 'synt-vm11')
        ]);

        new frappe.Chart('#chart', {
          title: `Births & Deaths — ${areaName}`,
          data: {
            labels: YEARS,
            datasets: [
              { name: 'Births', values: births, chartType: 'bar' },
              { name: 'Deaths', values: deaths, chartType: 'bar' }
            ]
          },
          type: 'bar',
          height: 450,
          colors: ['#63d0ff', '#363636'],
          axisOptions: { xIsSeries: true }
        });

        setStatus('');
      } catch (e) {
        setStatus(`Error loading data: ${e.message}`);
      }
    }

    init();
  </script>
</body>
</html>
